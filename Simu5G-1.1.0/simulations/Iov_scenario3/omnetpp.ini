[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../images
network = simu5g.simulations.Iov_scenario3.IovScenario

# Simulation parameters
debug-on-errors = false
print-undisposed = false
sim-time-limit=30s
**.udp.e2eDelay.vector-recording = true
*.rsu.udp.scalar-recording = true
*.car[0].udp.scalar-recording = true

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

# VeinsManager parameters
*.veinsManager.host = "localhost"
*.veinsManager.moduleType = "simu5g.nodes.cars.Car"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true
*.veinsManager.margin = 25

# Mobility parameters for dynamic nodes (cars)
*.car[*].mobilityType = "VeinsInetMobility"

# LTE specific parameters
**.numBands = 25
**.ueTxPower = 26
**.eNodeBTxPower = 46
**.sinrThreshold = 0dB

# Dynamic cell association for mobile nodes
*.car[*].cellularNic.phy.dynamicCellAssociation = true
**.car[*].masterId = 1
**.car[*].macCellId = 1

# --- RSU Wireless Configuration ---
# RSU UE configuration
*.rsu.cellularNic.phy.dynamicCellAssociation = true
*.rsu.masterId = 1
*.rsu.macCellId = 1
*.rsu.mobilityType = "StationaryMobility"
*.rsu.mobility.initialX = 400m
*.rsu.mobility.initialY = 300m
*.rsu.mobility.initialZ = 10m

# --- Network Configuration ---
# Configure network for follow scenario
*.configurator.typename = "FlatNetworkConfigurator"
*.configurator.addressType = "modulepath"

# Routing table
*.configurator.routes = xmldoc("config.xml", "configuration/routes")

# IPv4 Network Configuration
*.numCars = 2  # follow_1 and follow_2

# Car IP addressing
*.car[0].ipv4.configurator.interfaces = "wlan cellular"
*.car[1].ipv4.configurator.interfaces = "wlan cellular" 

# --- Follow Application Configuration ---

# Server Follow Application
*.server.numApps = 1
*.server.app[0].typename = "FollowServerApp"
*.server.app[0].localPort = 4000
*.server.app[0].destPort = 6000
*.server.app[0].processingDelay = 0.05s

# RSU Follow Application
*.rsu.numApps = 1
*.rsu.app[0].typename = "FollowRsuApp"
*.rsu.app[0].localPort = 5000
*.rsu.app[0].destPort = 4000  # 发送到服务器
*.rsu.app[0].processingDelay = 0.05s

# Car[0] - Lead Vehicle (follow_1)
*.car[0].numApps = 1
*.car[0].app[0].typename = "FollowCarApp"
*.car[0].app[0].localPort = 6000
*.car[0].app[0].vehicleRole = "lead"
*.car[0].app[0].stopTime = 5s

# Car[1] - Follow Vehicle (follow_2)  
*.car[1].numApps = 1
*.car[1].app[0].typename = "FollowCarApp"
*.car[1].app[0].localPort = 6001
*.car[1].app[0].vehicleRole = "follow"
*.car[1].app[0].stopTime = 999s  # 不自动停止，等待命令

# --- Radio Configuration ---
# Disable WiFi, use only cellular
*.car[*].wlan.radio.radioMediumModule = ""
*.rsu.wlan.radio.radioMediumModule = ""

# Configure only cellular communication
*.car[*].numRadios = 1
*.rsu.numRadios = 1

# Enable all cellular features
*.hasRNISupport = false

# --- Cellular Network Architecture ---
*.numExtCells = 0

# Base station
*.gNodeB.cellularNic.numCarriers = 1
*.gNodeB.cellularNic.phy.numAntenna = 2

# UE positioning for coverage
*.gNodeB.mobility.initialX = 400m
*.gNodeB.mobility.initialY = 300m
*.gNodeB.mobility.initialZ = 25m

# Car applications use cellular interface
*.car[*].ipv4.configurator.interfaces = "cellular"
*.rsu.ipv4.configurator.interfaces = "cellular"

# --- Network Layer Configuration ---
*.rsu.ipv4.arp.globalARP = true
*.car[*].ipv4.arp.globalARP = true

# Enable packet forwarding
*.rsu.ipv4.ip.enableNdpAutoconfig = false
*.car[*].ipv4.ip.enableNdpAutoconfig = false

# --- Logging Configuration ---
**.logLevel = "INFO"

# --- Additional TCP/UDP Parameters ---
**.tcpType = "Tcp"
**.udp.typename = "Udp"

# --- Power and interference models ---
*.gNodeB.cellularNic.phy.enableHandover = true
*.car[*].cellularNic.phy.enableHandover = true
*.rsu.cellularNic.phy.enableHandover = true

# Channel model
*.gNodeB.cellularNic.phy.channelModel = "RealChannel"
*.car[*].cellularNic.phy.channelModel = "RealChannel"  
*.rsu.cellularNic.phy.channelModel = "RealChannel"

# --- Follow Scenario Specific Settings ---
# Enable realistic car following behavior
*.car[*].cellularNic.phy.ueTxPower = 26
*.car[*].cellularNic.phy.d2dTxPower = 20

# Quality of Service for follow commands
*.car[*].cellularNic.mac.queueSize = 1MiB
*.rsu.cellularNic.mac.queueSize = 1MiB

# Fast response for follow commands
*.car[*].cellularNic.mac.maxHarqRtx = 3
*.rsu.cellularNic.mac.maxHarqRtx = 3