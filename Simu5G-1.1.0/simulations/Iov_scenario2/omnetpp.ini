[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../images
network = simu5g.simulations.Iov_scenario2.IovScenario

# Simulation parameters
debug-on-errors = false
print-undisposed = false
sim-time-limit=70s
**.udp.e2eDelay.vector-recording = true
*.rsu.udp.scalar-recording = true
*.car[0].udp.scalar-recording = true

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

# VeinsManager parameters
*.veinsManager.host = "localhost"
*.veinsManager.moduleType = "simu5g.nodes.cars.Car"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true  # 閼奉亜濮╅崗鎶芥４SUMO
*.veinsManager.margin = 25  # 婢х偛濮炴潏鍦?鏅?娴ｆ瑩鍣?
#*.veinsManager.launchd.sumocfg = "heterogeneous.sumocfg"  # 閺勫海鈥橀幐鍥х暰SUMO闁板秶鐤嗛弬鍥︽??

# Mobility parameters for dynamic nodes (cars)
*.car[*].mobilityType = "VeinsInetMobility"


# LTE specific parameters
**.numBands = 25
**.ueTxPower = 26
**.eNodeBTxPower = 46
**.sinrThreshold = 0dB

# Dynamic cell association for mobile nodes
*.car[*].cellularNic.phy.dynamicCellAssociation = true
**.car[*].masterId = 1
**.car[*].macCellId = 1

# --- RSU Wireless Configuration ---
# RSU UE configuration
*.rsu.cellularNic.phy.dynamicCellAssociation = true
*.rsu.masterId = 1
*.rsu.macCellId = 1
*.rsu.mobilityType = "StationaryMobility"
*.rsu.mobility.initialX = 561m
*.rsu.mobility.initialY = 42m
*.rsu.mobility.initialZ = 0m
*.rsu.cellularNic.phy.ueTxPower = 30mW

# Register RSU as an active UE with the Binder
*.binder.ueList = "rsu car[*]"
# --- End of RSU Configuration ---

# eNodeB configuration
**.eNodeB1.macCellId = 1
**.eNodeB1.macNodeId = 1
**.eNodeB2.macCellId = 2
**.eNodeB2.macNodeId = 2

# Enable handover
*.car[*].cellularNic.phy.enableHandover = true
*.eNodeB*.cellularNic.phy.enableHandover = true
*.eNodeB*.cellularNic.phy.handoverLatency = uniform(40ms, 60ms)
*.eNodeB*.cellInfo.broadcastMessageInterval = 1s

# Enable interference models
*.car[*].cellularNic.phy.channelModel.downlink_interference = true
*.car[*].cellularNic.phy.channelModel.uplink_interference = true
*.eNodeB*.cellularNic.phy.channelModel.downlink_interference = true
*.eNodeB*.cellularNic.phy.channelModel.uplink_interference = true
*.rsu.cellularNic.phy.channelModel.downlink_interference = true
*.rsu.cellularNic.phy.channelModel.uplink_interference = true

# X2 and SCTP configuration
*.eNodeB1.numX2Apps = 2
*.eNodeB2.numX2Apps = 2
*.eNodeB3.numX2Apps = 2

# eNodeB1 connections
*.eNodeB1.x2App[0].client.connectAddress = "eNodeB2%x2ppp0"
*.eNodeB1.x2App[1].client.connectAddress = "eNodeB3%x2ppp0"

# eNodeB2 connections
*.eNodeB2.x2App[0].client.connectAddress = "eNodeB1%x2ppp0"
*.eNodeB2.x2App[1].client.connectAddress = "eNodeB3%x2ppp0"

# eNodeB3 connections
*.eNodeB3.x2App[0].client.connectAddress = "eNodeB1%x2ppp0"
*.eNodeB3.x2App[1].client.connectAddress = "eNodeB2%x2ppp0"

# Common X2 configuration
**.eNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
**.eNodeB*.x2App[*].client.connectPort = 5000
**.eNodeB*.x2App[*].client.startTime = 0.5s
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

# --- Config for RSU -> Cloud -> Car Communication ---
[Config RSU-Cloud-Car]
# Application Setup using UdpBasicApp for reliable performance measurement

# RSU sends data to the server
*.rsu.numApps = 2
*.rsu.app[0].typename = "UdpBasicApp"
*.rsu.app[0].destAddresses = "server"
*.rsu.app[0].destPort = 5001
*.rsu.app[0].messageLength = 100B
*.rsu.app[0].sendInterval = 0.02s
*.rsu.app[0].startTime = 1s

*.rsu.app[1].typename = "UdpBasicApp"
*.rsu.app[1].destAddresses = "server"
*.rsu.app[1].destPort = 5000
*.rsu.app[1].messageLength = 100B
*.rsu.app[1].sendInterval = 0.02s
*.rsu.app[1].startTime = 1s

# Server acts as a relay: receives from RSU and sends to car[0]
*.server.numApps = 2
# App 0 receives from RSU (parameters are placeholders but required)
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].localPort = 5000
*.server.app[0].destAddresses = ""
*.server.app[0].destPort = 5000
*.server.app[0].messageLength = 0B
*.server.app[0].sendInterval = 0s # Never sends
*.server.app[0].startTime = 0s

# App 1 sends to car[0]
*.server.app[1].typename = "UdpBasicApp"
*.server.app[1].destAddresses = "car[0]"
*.server.app[1].destPort = 5001
*.server.app[1].messageLength = 100B
*.server.app[1].sendInterval = 0.02s
*.server.app[1].startTime = 1.1s # Simulate processing delay

# All cars are configured to receive, but only car[0] will get data
*.car[*].numApps = 1
*.car[*].app[0].typename = "UdpBasicApp"
*.car[*].app[0].localPort = 5001
*.car[*].app[0].destAddresses = "" # Not used, but required
*.car[*].app[0].destPort = 5001      # Not used, but required
*.car[*].app[0].messageLength = 0B   # Not used, but required
*.car[*].app[0].sendInterval = 0s # Never sends
*.car[*].app[0].startTime = 0s


# --- Statistics Recording Setup (Correct Syntax & Location) ---

# 1. End-to-End Delay (Vector)
*.car[*].udp.e2eDelay:vector.recording = true
*.car[0].app[0].endToEndDelay:vector.recording = true
*.car[0].app[0].endToEndDelay:histogram.recording = true

# 2. Throughput (Vector)
*.car[0].app[0].rcvdPk:throughput:vector.recording = true

# 3. Packet Loss Calculation (Scalars)
*.rsu.udp.sentPk:count.recording = true
*.car[0].udp.rcvdPk:count.recording = true
# 添加对自定义应用的包计数统计
*.car[0].app[0].speedCommandReceived:count.recording = true

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec

# --- Measurement of Bandwidth Utilization and Load ---

# 1. Bandwidth Utilization on the Core Network Link (Router <-> PGW)
# This records the utilization of the 10G Ethernet link.
# The result is a value between 0 and 1.
*.pgw.ppp[*].channel.utilization:vector.recording = true

# 2. Cell Load (Used PRBs) for each eNodeB
# This records the number of Physical Resource Blocks (PRBs) used in the downlink at each scheduling interval.
# To get the load ratio, this value must be divided by the total available PRBs.
*.eNodeB*.mac.usedPrbsDl:vector.recording = true

# --- Measurement of Physical Layer ---
# Signal quality measurements
*.car[*].cellularNic.phy.channelModel.rcvdSinr:vector.recording = true
*.car[*].cellularNic.phy.channelModel.rcvdSinr:histogram.recording = true
*.car[*].cellularNic.phy.channelModel.rcvdSinr:stats.recording = true

# Distance and coverage measurements
*.car[*].cellularNic.phy.channelModel.distance:vector.recording = true
*.car[*].cellularNic.phy.channelModel.coverageStatus:vector.recording = true

# Power measurements
*.car[*].cellularNic.phy.channelModel.receivedPower:vector.recording = true
*.car[*].cellularNic.phy.channelModel.receivedPower:stats.recording = true

# Interference measurements (will be overridden by more detailed settings below)
*.car[*].cellularNic.phy.channelModel.interferencePower:vector.recording = true

# --- Handover Statistics ---
*.car[*].cellularNic.phy.handoverAttempt:count.recording = true
*.car[*].cellularNic.phy.handoverFailure:count.recording = true
*.car[*].cellularNic.phy.handoverFailureSinrThreshold_dB = -5dB

# --- Handover Statistics (Corrected) ---
# Record handover attempts and failures
*.car[*].cellularNic.phy.handoverAttempt:vector.recording = true
*.car[*].cellularNic.phy.handoverFailure:vector.recording = true
#切换延迟
*.car[*].cellularNic.phy.handoverLatency = uniform(40ms, 60ms)

# Record handover latency (configured value)
*.eNodeB*.cellularNic.phy.handoverLatency = uniform(40ms, 60ms)
*.car[*].cellularNic.phy.handoverLatency:vector.recording = true
*.car[*].cellularNic.phy.handoverLatency:histogram.recording = true
*.car[*].cellularNic.phy.handoverLatency:stats.recording = true


# Record connection interruption duration (this is the actual handover delay)
*.car[*].cellularNic.phy.channelModel.interruptionDuration:vector.recording = true
*.car[*].cellularNic.phy.channelModel.interruptionDuration:histogram.recording = true
*.car[*].cellularNic.phy.channelModel.interruptionDuration:stats.recording = true

# --- Signal Strength Change Rate and Connection Interruption Statistics ---
*.car[*].cellularNic.phy.channelModel.rssiChangeRate:vector.recording = true
*.car[*].cellularNic.phy.channelModel.connectionInterruption:count.recording = true
*.car[*].cellularNic.phy.channelModel.connectionRestoration:count.recording = true

# --- Interference Statistics ---
# Record interference power (in dBm)
*.car[*].cellularNic.phy.channelModel.interferencePower:vector.recording = true
*.car[*].cellularNic.phy.channelModel.interferencePower:histogram.recording = true
*.car[*].cellularNic.phy.channelModel.interferencePower:stats.recording = true
*.car[*].cellularNic.phy.channelModel.interferencePower:mean.recording = true
*.car[*].cellularNic.phy.channelModel.interferencePower:max.recording = true

# Record interference for eNodeBs
*.eNodeB*.cellularNic.phy.channelModel.interferencePower:vector.recording = true
*.eNodeB*.cellularNic.phy.channelModel.interferencePower:mean.recording = true

# Add detailed interference analysis
# Note: Only interferencePower is directly available as a signal in Simu5G
# To get more detailed interference components, code modifications would be needed

# Calculate interference-to-noise ratio (post-processing)
# This can be done by comparing interferencePower with thermal noise + noise figure
# Thermal noise = -104.5 dBm, UE noise figure = 7 dB
# Total noise = -97.5 dBm

# --- Additional Interference Analysis ---
# Add a parameter to record raw SINR values for post-processing
*.car[*].cellularNic.phy.channelModel.measuredSinr:vector.recording = true
*.car[*].cellularNic.phy.channelModel.measuredSinr:histogram.recording = true



# --- 自动泊车配置 ---
[Config AutoParking]
extends = RSU-Cloud-Car
# RSU 应用: 作为UE通过蜂窝网络连接，向服务器发送泊车请求
*.rsu.numApps = 2
*.rsu.app[0].typename = "simu5g.apps.autoparking.AutoParkingRsuApp"
*.rsu.app[0].destAddresses = "server"  
*.rsu.app[0].destPort = 5000
*.rsu.app[0].messageLength = 256B
*.rsu.app[0].sendInterval = 1000s
*.rsu.app[0].checkInterval = 1s
*.rsu.app[0].monitoredLanes = "0/0to1/0_0 2/2to1/2_0"
*.rsu.app[0].parkingProbability = 0.5
*.rsu.app[0].parkingAreasFile = "parkingAreas.xml"
*.rsu.app[0].serverDestAddr = "server"  # 通过DNS解析服务器地址
*.rsu.app[0].serverDestPort = 5000

*.rsu.app[1].typename = "UdpBasicApp"
*.rsu.app[1].destAddresses = "server"
*.rsu.app[1].destPort = 5001
*.rsu.app[1].messageLength = 100B
*.rsu.app[1].sendInterval = 0.02s
*.rsu.app[1].startTime = 1s


# 服务器应用: 接收RSU的泊车请求并转发给车辆
*.server.numApps = 2
*.server.app[0].typename = "simu5g.apps.autoparking.AutoParkingServerApp"
*.server.app[0].localPort = 5000  # 监听RSU的请求
*.server.app[0].destPort = 5002   # 发送到车辆的端口
*.server.app[0].messageLength = 256B
*.server.app[0].parkingAreasFile = "parkingAreas.xml"
*.server.app[0].parkingAssignmentStrategy = "nearest"

*.server.app[1].typename = "UdpBasicApp"
*.server.app[1].localPort = 5001
*.server.app[1].destAddresses = "car[*]"
*.server.app[1].destPort = 5003
*.server.app[1].messageLength = 100B
*.server.app[1].sendInterval = 0.02s # Never sends
*.server.app[1].startTime = 1.1s

*.car[*].numApps = 2
*.car[*].app[1].typename = "UdpBasicApp"
*.car[*].app[1].localPort = 5003
*.car[*].app[1].destAddresses = "" # Not used, but required
*.car[*].app[1].destPort = 5003      # Not used, but required
*.car[*].app[1].messageLength = 0B   # Not used, but required
*.car[*].app[1].sendInterval = 0s # Never sends
*.car[*].app[1].startTime = 0s

# 车辆应用: 接收指令并执行泊车
*.car[4].numApps = 2
*.car[4].app[0].typename = "simu5g.apps.autoparking.AutoParkingCarApp"
*.car[4].app[0].localPort = 5002
*.car[4].app[0].smoothParking = true
*.car[4].app[0].responseTime = 1.0s

# 统计信息收集
*.rsu.app[0].parkingCommandSent:count.result-recording-modes = all
*.server.app[0].parkingCommandRelayed:count.result-recording-modes = all
*.car[4].app[0].parkingCommandReceived:count.result-recording-modes = all
*.car[4].app[0].parkingExecuted:count.result-recording-modes = all

# RSU app[1] UdpBasicApp统计配置
*.rsu.app[1].sentPk:count.recording = true
*.rsu.app[1].rcvdPk:count.recording = true
*.rsu.app[1].sentPk:vector.recording = true
*.rsu.app[1].rcvdPk:vector.recording = true
*.rsu.app[1].rcvdPk:throughput:vector.recording = true

# 端到端延迟测量配置 - 增强版
*.car[4].app[0].endToEndDelay:vector.recording = true
*.car[4].app[0].endToEndDelay:histogram.recording = true
*.car[4].app[0].endToEndDelay:stats.recording = true
*.car[4].app[0].endToEndDelay:mean.recording = true
